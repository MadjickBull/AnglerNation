<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | AnglerNation'">AnglerNation</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top" th:fragment="navbar">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-fish me-2"></i>AnglerNation
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rods"><i class="bi bi-vector-pen me-1"></i>Rods</a></li>
                    <li class="nav-item"><a class="nav-link" href="/lures"><i class="bi bi-bug me-1"></i>Lures</a></li>
                    <li class="nav-item"><a class="nav-link" href="/lines"><i class="bi bi-slash-circle me-1"></i>Lines</a></li>
                    <li class="nav-item"><a class="nav-link" href="/locations"><i class="bi bi-geo-alt me-1"></i>Locations</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fish"><i class="bi bi-trophy me-1"></i>Fish</a></li>
                    <li class="nav-item"><a class="nav-link" href="/catches"><i class="bi bi-journal-check me-1"></i>Catches</a></li>
                    <li class="nav-item"><a class="nav-link" href="/posts"><i class="bi bi-chat-left-text me-1"></i>Posts</a></li>
                    <li class="nav-item"><a class="nav-link" href="/comments"><i class="bi bi-chat me-1"></i>Comments</a></li>
                </ul>
                <div class="navbar-text text-light">
                    <small>v1.0</small>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4" th:fragment="content">
        <!-- Page content inserted here -->
    </main>

    <footer class="bg-light py-3 mt-5 border-top" th:fragment="footer">
        <div class="container text-center text-muted small">
            AnglerNation &copy; 2026 | Spring Boot 3.3 + Thymeleaf
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
