<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{base :: base}">
<head>
    <title th:text="${title} + ' | AnglerNation'">Domain List</title>
</head>
<body>
    <div th:replace="fragments/layout :: navbar"></div>
    <main class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h1 th:text="${title}"><i class="bi me-2"></i>Domain</h1>
            <div class="d-flex gap-2">
                <a th:href="@{/{domain}/new(domain=${domain})}" class="btn btn-primary">
                    <i class="bi bi-plus me-1"></i>Add New
                </a>
                <a th:href="@{/api/v1/{domain}(domain=${domain})}" target="_blank" class="btn btn-outline-secondary">
                    <i class="bi bi-code me-1"></i>API
                </a>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-3" method="get">
                    <div class="col-12 col-md-4">
                        <label class="form-label">Search</label>
                        <input type="text" name="search" class="form-control" placeholder="Search by name..." th:value="${search}">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">Page Size</label>
                        <select name="size" class="form-select" th:value="${size}">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Filter</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">All Items</h5>
                <small class="text-muted" th:text="'Total: ' + ${totalElements ?: '0'}"></small>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Type/Category</th>
                                <th>Description</th>
                                <th>Created</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${content}">
                                <td>
                                    <strong th:text="${item.name}">Name</strong>
                                    <br><small class="text-muted" th:text="${item.id}">ID</small>
                                </td>
                                <td th:text="${item.type ?: item.category ?: '-'}">Type</td>
                                <td>
                                    <span th:if="${item.description}" th:text="${item.description}">Description</span>
                                    <span class="text-muted" th:unless="${item.description}">No description</span>
                                </td>
                                <td th:text="${item.createdAt ? #temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">Created</td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/{domain}/{id}(domain=${domain}, id=${item.id})}" class="btn btn-outline-primary" title="View"><i class="bi bi-eye"></i></a>
                                        <a th:href="@{/{domain}/{id}/edit(domain=${domain}, id=${item.id})}" class="btn btn-outline-secondary" title="Edit"><i class="bi bi-pencil"></i></a>
                                        <form th:action="@{/{domain}/{id}(domain=${domain}, id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this item?')">
                                            <input type="hidden" name="_method" value="delete">
                                            <button type="submit" class="btn btn-outline-danger" title="Delete"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${content.empty}">
                                <td colspan="5" class="text-center py-4 text-muted">No items found. <a th:href="@{/{domain}/new(domain=${domain})}">Add the first one?</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card-footer" th:if="${totalPages > 1}">
                <nav aria-label="Pagination">
                    <ul class="pagination pagination-sm mb-0 justify-content-center">
                        <li class="page-item" th:classappend="${page == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/{domain}(domain=${domain}, page=0, size=${size}, search=${search})}"><i class="bi bi-chevron-double-left"></i></a>
                        </li>
                        <li class="page-item" th:classappend="${page == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/{domain}(domain=${domain}, page=${page-1}, size=${size}, search=${search})}"><i class="bi bi-chevron-left"></i></a>
                        </li>
                        <li class="page-item" th:each="p : ${#numbers.sequence(Math.max(0, page-2), Math.min(totalPages-1, page+2))}" th:classappend="${p == page ? 'active' : ''}">
                            <a class="page-link" th:href="@{/{domain}(domain=${domain}, page=${p}, size=${size}, search=${search})}" th:text="${p+1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${page == totalPages-1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/{domain}(domain=${domain}, page=${page+1}, size=${size}, search=${search})}"><i class="bi bi-chevron-right"></i></a>
                        </li>
                        <li class="page-item" th:classappend="${page == totalPages-1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/{domain}(domain=${domain}, page=${totalPages-1}, size=${size}, search=${search})}"><i class="bi bi-chevron-double-right"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
