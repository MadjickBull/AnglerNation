# Docker Compose for local development and testing
version: '3.8'

services:
  webhook-handler:
    build: .
    container_name: anglernation-webhook-handler
    ports:
      - "8081:8081"
    environment:
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-dev-secret-change-in-production}
      - WEBHOOK_QUEUE_DIR=/tmp/github_webhook_queue
    volumes:
      - webhook_queue:/tmp/github_webhook_queue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  webhook_queue: